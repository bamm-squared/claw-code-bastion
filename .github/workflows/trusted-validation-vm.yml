name: Disposable trusted validation VM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-validation-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-validation-vm:
    name: trusted validation on disposable rootless VM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLAW_REQUIRE_DISPOSABLE_VALIDATOR: "1"
      CLAW_VALIDATOR_WORKER_CLASS: disposable-vm
      CLAW_ACCEPTANCE_WORKER_IMAGE: claw-bastion-runtime:trusted-vm
      CLAW_ACCEPTANCE_VALIDATOR_IMAGE: claw-bastion-validator-rust:trusted-vm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install rootless validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman crun uidmap slirp4netns fuse-overlayfs netavark git
          user_name="$(id -un)"
          user_id="$(id -u)"
          sudo sh -c "grep -q '^${user_name}:' /etc/subuid || printf '%s:100000:65536\\n' '${user_name}' >> /etc/subuid"
          sudo sh -c "grep -q '^${user_name}:' /etc/subgid || printf '%s:100000:65536\\n' '${user_name}' >> /etc/subgid"
          sudo install -d -m 700 -o "${user_name}" -g "${user_name}" "/run/user/${user_id}"
          echo "XDG_RUNTIME_DIR=/run/user/${user_id}" >> "$GITHUB_ENV"
          echo "CONTAINERS_CONF=$RUNNER_TEMP/containers.conf" >> "$GITHUB_ENV"
          printf '[engine]\ncgroup_manager = "cgroupfs"\n' > "$RUNNER_TEMP/containers.conf"

      - name: Verify supported disposable worker
        env:
          CLAW_REAL_PODMAN_IMAGE: alpine:3.20
        run: |
          ./scripts/security-runner-preflight.sh
          podman info
          podman unshare cat /proc/self/uid_map
          podman unshare cat /proc/self/gid_map
          podman pull --quiet docker.io/library/alpine:3.20
          podman run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges alpine:3.20 sh -c 'test -x /bin/sh && ! wget -q -T 2 -O- https://example.invalid'

      - name: Build pinned validation images
        run: |
          podman pull docker.io/library/rust:bookworm
          podman pull docker.io/library/debian:bookworm-slim
          podman build --pull=never --build-arg CLAW_SOURCE_REVISION="$GITHUB_SHA" -f Containerfile.worker -t "$CLAW_ACCEPTANCE_WORKER_IMAGE" .
          podman build --pull=never --build-arg CLAW_SOURCE_REVISION="$GITHUB_SHA" -f Containerfile.validator -t "$CLAW_ACCEPTANCE_VALIDATOR_IMAGE" .
          podman image inspect --format 'worker={{.Id}}' "$CLAW_ACCEPTANCE_WORKER_IMAGE"
          podman image inspect --format 'validator={{.Id}}' "$CLAW_ACCEPTANCE_VALIDATOR_IMAGE"

      - name: Verify built worker policy
        env:
          CLAW_REAL_PODMAN_IMAGE: claw-bastion-runtime:trusted-vm
        run: ./scripts/security-runner-preflight.sh

      - name: Run repository secure-isolation tests
        env:
          CLAW_REAL_PODMAN_IMAGE: claw-bastion-runtime:trusted-vm
          CLAW_WORKER_IMAGE: claw-bastion-runtime:trusted-vm
          CLAW_VALIDATOR_IMAGE: claw-bastion-validator-rust:trusted-vm
        working-directory: rust
        run: |
          set -euo pipefail
          for test_name in \
            real_worker_boundary_blocks_host_state_and_allows_candidate_edits \
            real_worker_network_and_mount_policy_denies_host_state \
            real_worker_edit_positive_control \
            real_worker_outside_write_is_denied \
            real_worker_external_symlink_isolation \
            real_worker_candidate_git_metadata_is_harmless \
            real_worker_process_limit_and_output_bounds \
            real_validator_is_fresh_networkless_and_does_not_mutate_candidate \
            real_validator_host_and_socket_isolation \
            podman_full_hostile_authoritative_lifecycle \
            real_mcp_stdio_isolated_boundary_and_cleanup \
            real_private_mode_lifecycle_preserves_isolation_and_apply_boundary \
            real_custom_runtime_preserves_outer_security_policy \
            real_combined_hostile_lifecycle_keeps_canonical_authoritative
          do
            cargo test -p runtime --test podman_isolation -- "$test_name" --ignored --nocapture
          done

      - name: Run normal production lifecycle fixture
        run: ./scripts/run-local-acceptance.sh --task config-threading --artifacts-dir "$RUNNER_TEMP/acceptance"

      - name: Upload trusted-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-validation-vm-${{ github.run_id }}
          path: |
            artifacts/
            ${{ runner.temp }}/acceptance/
          if-no-files-found: ignore
