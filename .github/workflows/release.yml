name: Release Claw Code Bastion v1

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/claw-bastion-runtime

jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Verify Rust workspace
        run: |
          # Real Podman security tests are intentionally ignored here and run
          # by the dedicated self-hosted isolation-security workflow.
          cargo fmt --check
          cargo check --workspace
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --workspace
      - name: Build and package CLI
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then version="dev"; fi
          mkdir -p dist/package
          cargo build --release -p rusty-claude-cli
          install -m 0755 target/release/claw dist/package/claw
          cp ../README.md dist/package/README.md
          archive="dist/claw-code-bastion-v${version}-linux-x86_64.tar.gz"
          tar -C dist/package -czf "$archive" claw README.md
          sha256sum "$archive" > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: claw-linux-x86_64
          path: rust/dist/*
      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rust/dist/claw-code-bastion-*.tar.gz
            rust/dist/SHA256SUMS
          fail_on_unmatched_files: true

  runtime-image:
    name: publish versioned runtime image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish runtime
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker build \
            --build-arg "CLAW_VERSION=${version}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            -f Containerfile.worker \
            -t "${RUNTIME_IMAGE}:${version}" \
            -t "${RUNTIME_IMAGE}:latest" \
            .
          docker push "${RUNTIME_IMAGE}:${version}"
          case "$version" in
            *-*) echo "Prerelease ${version}: leaving stable latest unchanged" ;;
            *) docker push "${RUNTIME_IMAGE}:latest" ;;
          esac
